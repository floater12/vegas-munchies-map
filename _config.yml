title: Vegas Munchies Map
description: Licensed Las Vegas dispensaries paired with late-night eats, checked against official sources
url: "https://floater12.github.io"
baseurl: "/vegas-munchies-map"
theme: null

# Area pages in the header, in order. Add the next page's filename here.
header_pages:
  - map.md
  - south-point-area.md
  - strip-adjacent.md
  - downtown-fremont.md
  - henderson.md
  - west-valley.md
  - summerlin.md
  - north-las-vegas-northwest.md
  - late-night-deals-under-10.md
  - open-at-2am.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
